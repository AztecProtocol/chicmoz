apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: contract-compiler-image
build:
  artifacts:
    - image: contract-compiler
      context: ../../../services/event-cannon
      docker:
        dockerfile: Dockerfile.compile-contracts
        buildArgs:
          BASE_AZTEC_IMAGE: "azteclabs/aztec:6.0.0"
          NARGO_AZTEC_VERSION: "v6.0.0"
          DOCKER_DEFAULT_PLATFORM: "linux/amd64"
  tagPolicy:
    customTemplate:
      template: "6.0.0"

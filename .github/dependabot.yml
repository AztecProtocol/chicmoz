version: 2
updates:
  # Actions only: npm packages are bumped by hand, since unit tests alone cannot validate a bump.
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; each composite action is read only through its own directory.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # A release must be 7 days old before Dependabot proposes it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
